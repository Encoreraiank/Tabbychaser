<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tabby Chaser – Taking a Little Nap 🐾</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="48x48" href="favicon.png" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      background-color: #FAF4EB;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .brb-viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background-color: #FAF4EB;
    }

    .brb-gif {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 1;
    }

    .brb-mobile-gif {
      display: block;
    }
    .brb-pc-gif {
      display: none;
    }

    @media (min-width: 768px) {
      .brb-mobile-gif {
        display: none;
      }
      .brb-pc-gif {
        display: block;
      }
    }

    /* 100% Clickable Overlay over drawn Instagram button */
    .ig-click-area {
      position: absolute;
      z-index: 20;
      cursor: pointer;
      text-decoration: none;
      border-radius: 40px;
      transition: all 0.2s ease;
    }
    
    .ig-click-area:hover {
      transform: translateX(-50%) scale(1.04);
      box-shadow: 0 8px 25px rgba(45, 37, 34, 0.15);
    }

    /* Mobile Position over drawn Instagram pill */
    @media (max-width: 767px) {
      .ig-click-area {
        left: 50%;
        bottom: 12.5%;
        transform: translateX(-50%);
        width: 78%;
        max-width: 320px;
        height: 52px;
      }
    }

    /* PC Position over drawn Instagram pill */
    @media (min-width: 768px) {
      .ig-click-area {
        left: 50%;
        bottom: 14%;
        transform: translateX(-50%);
        width: 280px;
        height: 54px;
      }
    }
  </style>
</head>
<body>

  <div class="brb-viewport">
    <!-- User Animated GIFs -->
    <img src="brb/edfwsfrw.gif" alt="Tabby Chaser Taking a Nap" class="brb-gif brb-mobile-gif" />
    <img src="brb/tabyyywsed.gif" alt="Tabby Chaser Taking a Nap" class="brb-gif brb-pc-gif" />

    <!-- 100% Clickable Overlay over drawn Instagram button -->
    <a href="https://www.instagram.com/tabbychaser/" target="_blank" rel="noopener" class="ig-click-area" title="Follow @tabbychaser on Instagram"></a>
  </div>

</body>
</html>
