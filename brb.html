<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tabby Chaser – Taking a Little Nap 🐾</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="48x48" href="favicon.png" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #FAF4EB;
      overflow: hidden;
    }
    
    .brb-viewport {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #FAF4EB;
    }

    .brb-media {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100vw;
      height: 100vh;
      min-width: 100vw;
      min-height: 100vh;
      object-fit: cover !important;
      object-position: center !important;
      z-index: 1;
    }

    .brb-mobile-media {
      display: block;
    }
    .brb-pc-media {
      display: none;
    }

    @media (min-width: 768px) {
      .brb-mobile-media {
        display: none !important;
      }
      .brb-pc-media {
        display: block !important;
      }
    }

    /* 100% Clickable Instagram Button Overlay (Proportionately Positioned) */
    .ig-click-area {
      position: absolute;
      z-index: 20;
      cursor: pointer;
      text-decoration: none;
      border-radius: 40px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    
    .ig-click-area:hover {
      transform: translateX(-50%) scale(1.05);
      box-shadow: 0 8px 25px rgba(45, 37, 34, 0.2);
    }

    /* Mobile Position over drawn Instagram pill */
    @media (max-width: 767px) {
      .ig-click-area {
        left: 50%;
        bottom: 12%;
        transform: translateX(-50%);
        width: 76%;
        max-width: 320px;
        height: 54px;
      }
    }

    /* PC Position over drawn Instagram pill */
    @media (min-width: 768px) {
      .ig-click-area {
        left: 50%;
        bottom: 13.5%;
        transform: translateX(-50%);
        width: 290px;
        height: 56px;
      }
    }
  </style>
</head>
<body>

  <div class="brb-viewport">
    <!-- Animated Media (Cache Busted & Force Centered Full Bleed) -->
    <img src="brb/edfwsfrw.gif?v=2" alt="Tabby Chaser Taking a Nap Mobile" class="brb-media brb-mobile-media" />
    <img src="brb/tabyyywsed.gif?v=2" alt="Tabby Chaser Taking a Nap PC" class="brb-media brb-pc-media" />

    <!-- 100% Clickable Overlay over drawn Instagram button -->
    <a href="https://www.instagram.com/tabbychaser/" target="_blank" rel="noopener" class="ig-click-area" title="Follow @tabbychaser on Instagram"></a>
  </div>

</body>
</html>
