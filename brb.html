<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tabby Chaser – Taking a Little Nap 🐾</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="48x48" href="favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      background-color: #FAF4EB;
      font-family: 'Fredoka', cursive, sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    /* Fullscreen Viewport Wrapper */
    .brb-viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background-color: #FAF4EB;
    }

    /* Background Full Bleed Graphics */
    .brb-bg-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 1;
    }

    .brb-mobile-img {
      display: block;
    }
    .brb-pc-img {
      display: none;
    }

    @media (min-width: 768px) {
      .brb-mobile-img {
        display: none;
      }
      .brb-pc-img {
        display: block;
      }
    }

    /* Animation Layer Container (Scaled to graphic coordinates) */
    .anim-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      pointer-events: none;
    }

    /* --- 1. COFFEE STEAM ANIMATION --- */
    .steam-container {
      position: absolute;
      pointer-events: none;
    }
    /* Mobile Steam Position (Above Coffee Mug) */
    @media (max-width: 767px) {
      .steam-container {
        left: 20%;
        bottom: 30%;
        width: 60px;
        height: 80px;
      }
    }
    /* PC Steam Position (Above Coffee Mug) */
    @media (min-width: 768px) {
      .steam-container {
        left: 37.5%;
        bottom: 27%;
        width: 70px;
        height: 90px;
      }
    }

    .steam-line {
      position: absolute;
      bottom: 0;
      width: 4px;
      background: linear-gradient(to top, rgba(255,255,255,0.7), rgba(255,255,255,0));
      border-radius: 50%;
      filter: blur(2px);
      animation: steamRising 3.5s infinite ease-out;
    }
    .steam-line:nth-child(1) {
      left: 20%;
      height: 45px;
      animation-delay: 0s;
    }
    .steam-line:nth-child(2) {
      left: 50%;
      height: 60px;
      animation-delay: 1.2s;
    }
    .steam-line:nth-child(3) {
      left: 75%;
      height: 40px;
      animation-delay: 2.3s;
    }

    @keyframes steamRising {
      0% {
        transform: translateY(0) scaleX(1);
        opacity: 0;
      }
      20% {
        opacity: 0.65;
      }
      50% {
        transform: translateY(-25px) scaleX(1.8) rotate(5deg);
        opacity: 0.4;
      }
      100% {
        transform: translateY(-60px) scaleX(2.5) rotate(-8deg);
        opacity: 0;
      }
    }

    /* --- 2. SLEEPING CAT "z Z z" FLOATING ANIMATION --- */
    .zzz-container {
      position: absolute;
      pointer-events: none;
    }
    @media (max-width: 767px) {
      .zzz-container {
        left: 58%;
        bottom: 37%;
      }
    }
    @media (min-width: 768px) {
      .zzz-container {
        left: 52.5%;
        bottom: 39%;
      }
    }

    .zzz-char {
      position: absolute;
      font-weight: 700;
      color: #5C4A42;
      opacity: 0;
      animation: floatZZZ 4s infinite ease-in-out;
    }
    .zzz-1 {
      font-size: 1.1rem;
      left: 0;
      animation-delay: 0s;
    }
    .zzz-2 {
      font-size: 1.4rem;
      left: 14px;
      animation-delay: 1.3s;
    }
    .zzz-3 {
      font-size: 1.8rem;
      left: 32px;
      animation-delay: 2.6s;
    }

    @keyframes floatZZZ {
      0% {
        transform: translateY(0) scale(0.7) rotate(-5deg);
        opacity: 0;
      }
      30% {
        opacity: 0.85;
      }
      70% {
        transform: translateY(-30px) scale(1.1) rotate(8deg);
        opacity: 0.6;
      }
      100% {
        transform: translateY(-55px) scale(1.3) rotate(-3deg);
        opacity: 0;
      }
    }

    /* --- 3. FLOATING SPARKLES --- */
    .sparkle {
      position: absolute;
      font-size: 1.2rem;
      color: #EFA855;
      pointer-events: none;
      animation: sparkleGlow 3s infinite ease-in-out alternate;
    }
    .sparkle-1 {
      top: 36%;
      left: 64%;
      animation-delay: 0.5s;
    }
    .sparkle-2 {
      top: 26%;
      left: 34%;
      animation-delay: 1.8s;
    }

    @keyframes sparkleGlow {
      0% { transform: scale(0.8) rotate(0deg); opacity: 0.3; }
      100% { transform: scale(1.3) rotate(20deg); opacity: 1; filter: drop-shadow(0 0 4px #FBD38D); }
    }

    /* --- 4. INSTAGRAM BUTTON OVERLAY (EXACT POSITION OVER GRAPHIC) --- */
    .ig-click-area {
      position: absolute;
      z-index: 20;
      cursor: pointer;
      text-decoration: none;
      border-radius: 40px;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    
    .ig-click-area:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 24px rgba(45, 37, 34, 0.15);
    }

    /* Mobile Position (Exactly over drawn pill) */
    @media (max-width: 767px) {
      .ig-click-area {
        left: 50%;
        bottom: 12.5%;
        transform: translateX(-50%);
        width: 76%;
        max-width: 320px;
        height: 52px;
      }
      .ig-click-area:hover {
        transform: translateX(-50%) scale(1.04);
      }
    }

    /* PC Position (Exactly over drawn pill) */
    @media (min-width: 768px) {
      .ig-click-area {
        left: 50%;
        bottom: 14%;
        transform: translateX(-50%);
        width: 280px;
        height: 54px;
      }
      .ig-click-area:hover {
        transform: translateX(-50%) scale(1.05);
      }
    }
  </style>
</head>
<body>

  <div class="brb-viewport">
    <!-- Full-Bleed Background Images -->
    <img src="brb-mobile.png" alt="Tabby Chaser BRB Mobile" class="brb-bg-img brb-mobile-img" />
    <img src="brb-pc.jpg" alt="Tabby Chaser BRB Desktop" class="brb-bg-img brb-pc-img" />

    <!-- Animated Effects Layer -->
    <div class="anim-layer">
      <!-- 1. Rising Coffee Steam -->
      <div class="steam-container">
        <div class="steam-line"></div>
        <div class="steam-line"></div>
        <div class="steam-line"></div>
      </div>

      <!-- 2. Sleeping Cat Floating zZZ -->
      <div class="zzz-container">
        <span class="zzz-char zzz-1">z</span>
        <span class="zzz-char zzz-2">Z</span>
        <span class="zzz-char zzz-3">z</span>
      </div>

      <!-- 3. Cozy Sparkles -->
      <span class="sparkle sparkle-1">✨</span>
      <span class="sparkle sparkle-2">✨</span>
    </div>

    <!-- 4. Interactive Clickable Instagram Button (Positioned exactly over the graphic's Instagram pill) -->
    <a href="https://www.instagram.com/tabbychaser/" target="_blank" rel="noopener" class="ig-click-area" title="Follow @tabbychaser on Instagram"></a>
  </div>

</body>
</html>
